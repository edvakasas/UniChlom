spring.application.name=estimate-calculator
server.port=${PORT:8080}

# In-memory H2: the database is created on start and filled from data.sql, so every run starts from the same sample data
spring.datasource.url=jdbc:h2:mem:samata;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
