<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sąmatų skaičiuoklė</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 16px; }
  label { display: block; margin: 4px 0; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { border-bottom: 1px solid #ddd; padding: 4px 6px; text-align: left; }
  td.num, th.num { text-align: right; }
  .errors { color: #b00020; }
  .status { font-weight: bold; }
  button { padding: 6px 14px; margin-right: 8px; }
  input[type=number] { width: 90px; }
</style>
</head>
<body>
<h1>Autoserviso sąmata</h1>

<form id="estimate-form">
  <fieldset>
    <legend>Servisas ir automobilis</legend>
    <label>Servisas
      <select id="workshop">
        <option value="alfa">Autoservisas Alfa</option>
        <option value="beta">Autoservisas Beta</option>
      </select>
    </label>
    <label>Automobilio klasė
      <select id="car-class">
        <option>LENGVASIS</option><option>VISUREIGIS</option><option>MIKROAUTOBUSAS</option>
      </select>
    </label>
    <label><input type="checkbox" id="regular"> Nuolatinis klientas</label>
    <label>Kliento kainos riba, € su PVM (neprivaloma) <input type="number" id="limit" step="0.01" min="0"></label>
  </fieldset>

  <fieldset>
    <legend>Darbai</legend>
    <div id="works">Kraunama...</div>
  </fieldset>

  <fieldset>
    <legend>Detalės (pirkimo kaina be PVM)</legend>
    <table>
      <thead><tr><th>Pavadinimas</th><th>Kaina, €</th><th>Kiekis</th><th></th></tr></thead>
      <tbody id="parts"></tbody>
    </table>
    <button type="button" id="add-part">+ Pridėti detalę</button>
  </fieldset>

  <button type="submit">Skaičiuoti</button>
</form>

<div id="result"></div>

<script>
// The page only collects input and shows results: every calculation happens on the server (EstimateCalculator).
const $ = id => document.getElementById(id);
const euro = n => Number(n).toFixed(2) + ' €';
const esc = text => String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

function api(method, path, body) {
  return fetch(path, {
    method,
    headers: { 'X-Tenant-Id': $('workshop').value, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(async response => ({ ok: response.ok, data: await response.json() }));
}

async function loadWorks() {
  const { ok, data } = await api('GET', '/api/works');
  if (!ok) { $('works').textContent = data.errors.join('; '); return; }
  $('works').innerHTML = '';
  for (const work of data) {
    const label = document.createElement('label');
    const promo = work.promotionPercent ? ` (akcija −${work.promotionPercent} %)` : '';
    label.innerHTML = `<input type="checkbox" value="${esc(work.code)}"> `;
    label.append(`${work.code} ${work.name}, ${work.normHours} h${promo}`);
    $('works').append(label);
  }
}

function addPartRow(name = '', unitCost = '', quantity = 1) {
  const row = document.createElement('tr');
  row.innerHTML = `<td><input class="part-name"></td>
    <td><input class="part-cost" type="number" step="0.01"></td>
    <td><input class="part-qty" type="number" step="0.01"></td>
    <td><button type="button">Šalinti</button></td>`;
  row.querySelector('.part-name').value = name;
  row.querySelector('.part-cost').value = unitCost;
  row.querySelector('.part-qty').value = quantity;
  row.querySelector('button').onclick = () => row.remove();
  $('parts').append(row);
}

function readRequest() {
  const numberOrNull = value => value === '' ? null : Number(value);
  return {
    carClass: $('car-class').value,
    regularCustomer: $('regular').checked,
    workCodes: [...$('works').querySelectorAll('input:checked')].map(box => box.value),
    parts: [...$('parts').rows].map(row => ({
      name: row.querySelector('.part-name').value,
      unitCost: numberOrNull(row.querySelector('.part-cost').value),
      quantity: numberOrNull(row.querySelector('.part-qty').value)
    })),
    priceLimit: numberOrNull($('limit').value)
  };
}

function showErrors(errors) {
  $('result').innerHTML = '<h2>Sąmata nesudaryta</h2><ul class="errors"></ul>';
  for (const message of errors) {
    const item = document.createElement('li');
    item.textContent = message;
    $('result').querySelector('ul').append(item);
  }
}

function showEstimate({ id, estimate }) {
  const labor = estimate.laborLines.map(line => `<tr><td>${esc(line.code)}</td><td>${esc(line.name)}</td>
      <td class="num">${line.billedHours} h</td><td class="num">${euro(line.price)}</td>
      <td class="num">${Number(line.discountPercent)} %</td><td class="num">${euro(line.finalPrice)}</td></tr>`).join('');
  const parts = estimate.partLines.map(line => `<tr><td colspan="2">${esc(line.name)}</td>
      <td class="num">${line.quantity}</td><td class="num">${euro(line.unitCost)}</td>
      <td></td><td class="num">${euro(line.price)}</td></tr>`).join('');
  const over = estimate.overLimitBy ? ` (riba viršyta ${euro(estimate.overLimitBy)})` : '';
  $('result').innerHTML = `<h2>Sąmata Nr. ${id}</h2>
    <table>
      <thead><tr><th>Kodas</th><th>Darbas / detalė</th><th class="num">Val. / kiekis</th>
        <th class="num">Kaina</th><th class="num">Nuolaida</th><th class="num">Suma</th></tr></thead>
      <tbody>${labor}${parts}</tbody>
    </table>
    <table>
      <tr><td>Darbai</td><td class="num">${euro(estimate.laborTotal)}</td></tr>
      <tr><td>Detalės</td><td class="num">${euro(estimate.partsTotal)}</td></tr>
      <tr><td>Suma be PVM</td><td class="num">${euro(estimate.subtotal)}</td></tr>
      <tr><td>PVM</td><td class="num">${euro(estimate.vat)}</td></tr>
      <tr><th>Iš viso</th><th class="num">${euro(estimate.total)}</th></tr>
    </table>
    <p class="status">Būsena: ${estimate.status}${over}</p>`;
  if (estimate.status === 'LAUKIA_PATVIRTINIMO') {
    const approve = document.createElement('button');
    approve.textContent = 'Klientas patvirtino';
    approve.onclick = async () => {
      const { ok, data } = await api('POST', `/api/estimates/${id}/approve`);
      ok ? showEstimate(data) : showErrors(data.errors);
    };
    $('result').append(approve);
  }
}

$('estimate-form').onsubmit = async event => {
  event.preventDefault();
  const { ok, data } = await api('POST', '/api/estimates', readRequest());
  ok ? showEstimate(data) : showErrors(data.errors);
};
$('workshop').onchange = loadWorks;
$('add-part').onclick = () => addPartRow();

addPartRow();
loadWorks();
</script>
</body>
</html>
